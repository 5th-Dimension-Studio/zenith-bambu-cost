name: Build Zenith Bambu Studio
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download your build files
        uses: actions/checkout@v4
      - name: Install build tools on GitHub's computer
        run: |
          choco install strawberryperl pkgconfiglite nsis -y --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Prerequisite installation failed' }
          python -m pip install cmake==3.31.6
          if ($LASTEXITCODE -ne 0) { throw 'CMake installation failed' }
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\Strawberry\c\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the Windows app and run calculation tests
        run: |
          ./Build-Windows.ps1 -WorkDirectory "$env:GITHUB_WORKSPACE/work"
      - name: Upload the Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-BambuStudio-Windows
          path: work/Zenith-BambuStudio-Windows/
          if-no-files-found: error
          retention-days: 14
      - name: Keep the exact patched source
        if: success()
        run: |
          git -C work/BambuStudio add src/slic3r/GUI/GCodeRenderer/BaseRenderer.cpp src/slic3r/GUI/GCodeRenderer/ZenithCost.hpp src/slic3r/GUI/GCodeRenderer/ZenithCostPanel.hpp zenith/tests
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage source snapshot' }
          $tree = git -C work/BambuStudio write-tree
          if ($LASTEXITCODE -ne 0) { throw 'Could not record source tree' }
          git -C work/BambuStudio archive --format=zip --output="$env:GITHUB_WORKSPACE/Zenith-Corresponding-Source.zip" $tree
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive corresponding source' }
      - name: Upload corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-Corresponding-Source
          path: Zenith-Corresponding-Source.zip
          if-no-files-found: error
          retention-days: 14
